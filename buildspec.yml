version: 0.2

env:
  shell: bash

phases:
  install:
    on-failure: ABORT
    runtime-versions:
      nodejs: 22
    commands:
      - echo "[install] Installing dependencies from package-lock.json"
      - node --version
      - npm --version
      - npm ci

  pre_build:
    on-failure: ABORT
    commands:
      - echo "[pre_build] Running JavaScript syntax checks"
      - npm run check
      - echo "[pre_build] Running Jest tests"
      - npm test
      - echo "[pre_build] Validating infrastructure/application.yml"
      - aws cloudformation validate-template --template-body file://infrastructure/application.yml > /dev/null
      - echo "[pre_build] All quality gates passed"

  build:
    on-failure: ABORT
    commands:
      - echo "[build] Creating the application artifact"
      - npm run build
      - printf '%s\n' "${CODEBUILD_RESOLVED_SOURCE_VERSION:-unknown}" > dist/commit-id.txt
      - printf '%s\n' "${CODEBUILD_BUILD_NUMBER:-unknown}" > dist/build-number.txt
      - echo "[build] Recorded source commit and CodeBuild build number"

  post_build:
    on-failure: ABORT
    commands:
      - echo "[post_build] Build completed at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - echo "[post_build] Artifact upload follows this phase"

reports:
  $TEST_REPORT_GROUP_ARN:
    files:
      - junit.xml
    base-directory: reports
    file-format: JUNITXML

artifacts:
  name: builds/$CODEBUILD_BUILD_NUMBER/aws-devops-demo-$CODEBUILD_RESOLVED_SOURCE_VERSION.zip
  files:
    - "dist/**/*"
  discard-paths: no

cache:
  paths:
    - "/root/.npm/**/*"
