name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Upload test results after a failure
        if: ${{ failure() && hashFiles('reports/junit.xml') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-results
          path: reports/junit.xml
          if-no-files-found: ignore
          retention-days: 7
